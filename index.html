<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관계정서진단 — 테이커·매쳐·기버·호구</title>
<style>
  :root {
    --cream: #F4F1EA;
    --paper: #FFFFFF;
    --ink: #2A2420;
    --ink-soft: #6B6255;
    --line: #E4DDD0;
    --rust: #C1452D;    /* 호구 */
    --moss: #3F6B45;    /* 테이커 */
    --slate: #3B4A66;   /* 매쳐 */
    --amber: #C9A227;   /* 기버 */
    --font-display: "Noto Serif KR", "Apple SD Gothic Neo", "Nanum Myeongjo", serif;
    --font-body: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, sans-serif;
    --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(circle at 12% 8%, rgba(193,69,45,0.07), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(63,107,69,0.08), transparent 45%),
      var(--cream);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .stage {
    width: 100%;
    max-width: 560px;
  }

  .card {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 44px 40px;
    box-shadow: 0 1px 2px rgba(42,36,32,0.03);
    animation: rise 0.45s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--rust);
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  h1 {
    font-family: var(--font-display);
    font-size: 30px;
    line-height: 1.35;
    font-weight: 700;
    margin-bottom: 18px;
  }

  .lead {
    font-size: 15px;
    line-height: 1.75;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .lead strong { color: var(--ink); font-weight: 600; }

  .divider {
    height: 1px;
    background: var(--line);
    margin: 28px 0;
  }

  .choice-list { display: flex; flex-direction: column; gap: 10px; }

  .choice {
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 16px 18px;
    background: var(--paper);
    cursor: pointer;
    font-family: var(--font-body);
    font-size: 15px;
    text-align: left;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }

  .choice:hover { border-color: var(--ink); background: #FBFAF7; }
  .choice:active { transform: scale(0.99); }
  .choice.selected { border-color: var(--ink); background: #FBFAF7; font-weight: 600; }

  .choice-title { font-weight: 600; margin-bottom: 4px; }
  .choice-desc { font-size: 13px; color: var(--ink-soft); }

  input[type="text"] {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 14px 16px;
    font-size: 16px;
    font-family: var(--font-body);
    background: var(--cream);
    color: var(--ink);
    margin-bottom: 20px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--ink); }

  .btn-row { display: flex; gap: 10px; }

  .btn {
    flex: 1;
    padding: 15px 18px;
    border-radius: 3px;
    border: 1px solid var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
    text-align: center;
  }

  .btn:hover { opacity: 0.85; }

  .btn-primary { background: var(--ink); color: var(--cream); }
  .btn-ghost { background: transparent; color: var(--ink); }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }

  .progress-track {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 30px;
  }

  .progress-fill {
    height: 100%;
    background: var(--rust);
    transition: width 0.35s ease;
  }

  .q-label {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--rust);
    margin-bottom: 10px;
  }

  .q-text {
    font-family: var(--font-display);
    font-size: 20px;
    line-height: 1.5;
    margin-bottom: 26px;
  }

  .back-link {
    display: inline-block;
    margin-top: 22px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--font-body);
  }
  .back-link:hover { color: var(--ink); }

  /* Result — template layout */
  .result-card { padding: 40px 36px 34px; }

  .result-eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--ink-soft);
    margin-bottom: 10px;
    animation: fadeIn 0.4s ease both;
  }

  .result-title {
    font-family: var(--font-display);
    font-size: 38px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--type-color);
    margin-bottom: 6px;
    animation: riseIn 0.5s 0.05s cubic-bezier(.16,.84,.44,1) both;
  }

  .result-title .en {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 500;
    color: var(--ink-soft);
    vertical-align: middle;
    margin-left: 2px;
  }

  .bar-item-name .en {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 500;
    color: var(--ink-soft);
    margin-left: 2px;
  }

  .result-archetype {
    font-size: 14px;
    color: var(--ink-soft);
    margin-bottom: 20px;
  }

  .result-quote {
    font-family: var(--font-display);
    font-size: 19px;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes riseIn { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform: translateY(0);} }
  @keyframes growBar { from { width: 0%; } }

  .bar-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }

  .bar-item-head {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 5px;
  }

  .bar-item-name { font-weight: 600; }
  .bar-item-name.lead { font-weight: 700; }
  .bar-item-score { font-family: var(--font-mono); color: var(--ink-soft); font-size: 12px; }

  .bar-track {
    height: 7px;
    background: var(--line);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-track.thin { height: 5px; }

  .bar-fill {
    height: 100%;
    border-radius: 4px;
    width: 0%;
    transition: width 0.9s cubic-bezier(.16,.84,.44,1);
  }

  .insight-box {
    border-radius: 4px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }

  .insight-title {
    font-weight: 700;
    font-size: 14px;
    color: var(--type-color);
    margin-bottom: 10px;
  }

  .insight-list { list-style: none; }
  .insight-list li {
    font-size: 13.5px;
    line-height: 1.9;
    padding-left: 16px;
    position: relative;
  }
  .insight-list li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: var(--type-color);
  }

  .theory-heading {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 12px;
  }

  .theory-list { display: flex; flex-direction: column; gap: 9px; margin-bottom: 24px; }
  .theory-row { font-size: 13px; line-height: 1.6; }
  .theory-name { font-weight: 700; margin-right: 6px; }

  .roosevelt {
    font-family: var(--font-display);
    font-style: italic;
    font-size: 14px;
    line-height: 1.7;
    text-align: center;
    color: var(--ink-soft);
    padding: 20px 10px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .roosevelt .attr { display:block; margin-top: 8px; font-style: normal; font-size: 12px; }

  .footnote {
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 22px;
    line-height: 1.7;
  }

  @media (max-width: 480px) {
    .card { padding: 32px 24px; }
    h1 { font-size: 25px; }
    .result-card { padding: 32px 24px 28px; }
    .result-title { font-size: 30px; }
  }
</style>
</head>

        '<p class="lead">Adam Grant · Simon Sinek · Peter Senge가 각자 다른 언어로 가리킨 같은 자리를, 12개 문항으로 확인합니다.</p>' +
        '<div class="divider"></div>' +
        '<p class="lead" style="margin-bottom:14px"><strong>무엇을 진단할까요?</strong></p>' +
        '<div class="choice-list">' +
          '<div class="choice" onclick="App.chooseMode(\'other\')">' +
            '<div class="choice-title">그 사람을 진단</div>' +
            '<div class="choice-desc">같이 일하는 동료·팀원이 어떤 유형인지</div>' +
          '</div>' +
          '<div class="choice" onclick="App.chooseMode(\'self\')">' +
            '<div class="choice-title">나를 진단</div>' +
            '<div class="choice-desc">나는 관계에서 주로 어떤 자리를 차지하는지</div>' +
          '</div>' +
        '</div>' +
      '</div>';
  }

  function renderName() {
    var isOther = state.mode === 'other';
    var title = isOther ? '그 사람의 이름을(를) 알려주세요.' : '당신의 이름을(를) 알려주세요.';
    var desc = isOther
      ? '결과를 정리할 때 누구의 진단인지 구분하기 위해 사용됩니다. 선택사항입니다 — 비워두고 넘어가도 괜찮아요.'
      : '결과 화면에 표시됩니다. 선택사항이에요 — 비워두고 넘어가도 괜찮아요.';
    var placeholder = isOther ? '이름 또는 별명' : '이름';

    stage.innerHTML =
      '<div class="card">' +
        '<div class="eyebrow">시작하기 전에</div>' +
        '<h1 style="font-size:22px">' + title + '</h1>' +
        '<p class="lead" style="margin-bottom:18px">' + desc + '</p>' +
        '<input type="text" id="nameInput" placeholder="' + placeholder + '" value="' + escapeHtml(state.name) + '">' +
        '<div class="btn-row">' +
          '<button class="btn btn-ghost" onclick="App.skipName()">건너뛰고 시작</button>' +
          '<button class="btn btn-primary" onclick="App.startQuiz()">진단 시작</button>' +
        '</div>' +
        '<button class="back-link" onclick="App.go(\'intro\')">‹ 처음으로</button>' +
      '</div>';
  }

  function renderQuiz() {
    var i = state.qIndex;
    var questions = currentQuestions();
    var q = questions[i];
    var selected = state.answers[q.id];
    var pct = Math.round((i / questions.length) * 100);
    var headerLabel = state.mode === 'other' ? '그 사람을 진단' : '나를 진단';

    var optsHtml = OPTIONS.map(function(o){
      var sel = selected === o.v ? ' selected' : '';
      return '<div class="choice' + sel + '" onclick="App.answer(' + q.id + ',' + o.v + ')">' + o.label + '</div>';
    }).join('');

    stage.innerHTML =
      '<div class="card">' +
        '<div class="progress-row"><span>' + headerLabel + '</span><span>' + i + ' / ' + questions.length + '</span></div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="q-label">Q' + (i+1) + '</div>' +
        '<div class="q-text">' + q.text + '</div>' +
        '<div class="choice-list">' + optsHtml + '</div>' +
        (i > 0 ? '<button class="back-link" onclick="App.prevQ()">‹ 이전 문항</button>' : '<button class="back-link" onclick="App.go(\'name\')">‹ 처음으로</button>') +
      '</div>';
  }

  function computeScores() {
    var scores = { taker:0, matcher:0, giver:0, doormat:0 };
    currentQuestions().forEach(function(q){
      var v = state.answers[q.id] || 0;
      scores[q.axis] += v;
    });
    return scores; // each axis 3~12
  }

  function renderResult() {
    var scores = computeScores();

    var axisOrder = ['taker','matcher','giver','doormat'];
    var ranked = axisOrder.slice().sort(function(a,b){
      if (scores[b] !== scores[a]) return scores[b] - scores[a];
      return PRIORITY.indexOf(a) - PRIORITY.indexOf(b);
    });
    var primary = ranked[0];
    var meta = TYPE_META[primary];

    if (db && !state.saved) {
      state.saved = true;
      db.collection('diagnoses').add({
        mode: state.mode,
        name: state.name || null,
        type: primary,
        scores: scores,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(function(e){ console.warn('저장 실패', e); });
    }

    var scoreTotal = scores.taker + scores.matcher + scores.giver + scores.doormat;
    function pctShare(k){ return scoreTotal ? Math.round((scores[k]/scoreTotal)*100) : 25; }

    var isOther = state.mode === 'other';
    var eyebrow;
    if (state.name) {
      eyebrow = escapeHtml(state.name) + (isOther ? '의 유형은' : '님의 유형은');
    } else {
      eyebrow = isOther ? '그 사람의 유형은' : '당신의 유형은';
    }

    var barList = ranked.map(function(k, idx){
      var m = TYPE_META[k];
      var isLead = idx === 0;
      return (
        '<div class="bar-item">' +
          '<div class="bar-item-head">' +
            '<span class="bar-item-name' + (isLead ? ' lead' : '') + '" style="color:' + (isLead ? m.hex : 'var(--ink)') + '">' + m.emoji + ' ' + m.name + ' <span class="en">' + m.en + '</span></span>' +
            '<span class="bar-item-score">' + pctShare(k) + '%</span>' +
          '</div>' +
          '<div class="bar-track' + (isLead ? '' : ' thin') + '"><div class="bar-fill js-bar" data-pct="' + pctShare(k) + '" style="background:' + m.hex + '"></div></div>' +
        '</div>'
      );
    }).join('');

    var bulletsHtml = meta.bullets.map(function(b){ return '<li>' + b + '</li>'; }).join('');

    var theoryHtml =
      '<div class="theory-row"><span class="theory-name" style="color:' + meta.hex + '">Adam Grant</span>' + meta.theory.grant + '</div>' +
      '<div class="theory-row"><span class="theory-name" style="color:' + meta.hex + '">Simon Sinek</span>' + meta.theory.sinek + '</div>' +
      '<div class="theory-row"><span class="theory-name" style="color:' + meta.hex + '">Peter Senge</span>' + meta.theory.senge + '</div>';

    stage.innerHTML =
      '<div class="card result-card" style="--type-color:' + meta.hex + '">' +
        '<div class="result-eyebrow">' + eyebrow + '</div>' +
        '<div class="result-title">' + meta.emoji + ' ' + meta.name + ' <span class="en">' + meta.en + '</span></div>' +
        '<div class="result-archetype">' + meta.archetype + '</div>' +
        '<div class="result-quote">“' + meta.quote + '”</div>' +

        '<div class="bar-list">' + barList + '</div>' +

        '<div class="insight-box" style="background:' + shade(meta.hex, 0.9) + '">' +
          '<div class="insight-title">이런 모습이 보입니다</div>' +
          '<ul class="insight-list">' + bulletsHtml + '</ul>' +
        '</div>' +

        '<div class="theory-heading">세 이론이 같은 자리를 가리킵니다</div>' +
        '<div class="theory-list">' + theoryHtml + '</div>' +

        '<div class="roosevelt">' + ROOSEVELT + '<span class="attr">— Theodore Roosevelt</span></div>' +

        '<div class="footnote">각 유형(3문항)의 점수를 모두 더한 뒤, 그중 이 유형이 차지하는 비율로 퍼센트를 계산합니다. 네 유형은 우열이 아니라 서로 다른 관계 방식입니다.</div>' +

        '<div class="btn-row">' +
          '<button class="btn btn-ghost" style="width:100%" onclick="App.restart()">다시 진단하기</button>' +
        '</div>' +
      '</div>';

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        stage.querySelectorAll('.js-bar').forEach(function(el){
          el.style.width = el.getAttribute('data-pct') + '%';
        });
      });
    });
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  window.App = {
    go: function(screen){ state.screen = screen; render(); },
    chooseMode: function(mode){
      state.mode = mode;
      state.name = '';
      state.answers = {};
      state.qIndex = 0;
      state.screen = 'name';
      render();
    },
    skipName: function(){ state.name = ''; state.screen='quiz'; state.qIndex=0; render(); },
    startQuiz: function(){
      var el = document.getElementById('nameInput');
      state.name = el ? el.value.trim() : '';
      state.screen = 'quiz';
      state.qIndex = 0;
      render();
    },
    answer: function(qId, val){
      state.answers[qId] = val;
      var questions = currentQuestions();
      if (state.qIndex < questions.length - 1) {
        state.qIndex += 1;
        render();
      } else {
        state.screen = 'result';
        render();
      }
    },
    prevQ: function(){
      if (state.qIndex > 0) { state.qIndex -= 1; render(); }
    },
    restart: function(){
      state = { screen:'intro', name:'', qIndex:0, answers:{}, saved:false };
      render();
    }
  };

  render();
})();
</script>
</body>
</html>
